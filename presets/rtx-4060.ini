; GPUConfig preset: mainstream gaming PC
;   GPU  NVIDIA GeForce RTX 4060, 8 GB (INF key NVIDIA_DEV.2882)
;   CPU  AMD Ryzen 5 5600X, 6 cores / 12 threads
;   RAM  16 GB
; Copy over GPUConfig.ini next to version.dll.  Keys are documented in the
; GPUConfig.ini at the repo root.

[GPU]
Mode=custom

AdapterDescription=NVIDIA GeForce RTX 4060
VendorId=0x10DE
DeviceId=0x2882
; NVIDIA's INF has no board-specific entry for this card, so this is a
; placeholder with NVIDIA as the subsystem vendor.
SubSysId=0x000010DE
VramGB=8
GLRenderer=NVIDIA GeForce RTX 4060/PCIe/SSE2
GLVendor=NVIDIA Corporation

CPUName=AMD Ryzen 5 5600X 6-Core Processor
CPUPhysicalCores=6
CPULogicalProcessors=12
CPUMaxClockMHz=3700
RamGB=16

; CPUID patching is opt-in; read the warning in GPUConfig.ini first.
SpoofCpu=false
CPUFamily=0x19
CPUModel=0x21
CPUStepping=0x0

LogLevel=1
