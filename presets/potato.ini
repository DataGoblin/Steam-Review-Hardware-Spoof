; GPUConfig preset: the joke one
;   GPU  "Potato Processing Unit", 1 GB
;        (made-up name on the GeForce GTX 1630's ID, INF key NVIDIA_DEV.1F83)
;   CPU  AMD Athlon 3000G, 2 cores / 4 threads
;   RAM  4 GB
; Copy over GPUConfig.ini next to version.dll.  Keys are documented in the
; GPUConfig.ini at the repo root.

[GPU]
Mode=custom

AdapterDescription=Potato Processing Unit
VendorId=0x10DE
DeviceId=0x1F83
; NVIDIA's INF has no board-specific entry for this card, so this is a
; placeholder with NVIDIA as the subsystem vendor.
SubSysId=0x000010DE
VramGB=1
GLRenderer=Potato Processing Unit/PCIe/SSE2
GLVendor=NVIDIA Corporation

CPUName=AMD Athlon 3000G with Radeon Vega Graphics
CPUPhysicalCores=2
CPULogicalProcessors=4
CPUMaxClockMHz=3500
RamGB=4

; CPUID patching is opt-in; read the warning in GPUConfig.ini first.
SpoofCpu=false
CPUFamily=0x17
CPUModel=0x18
CPUStepping=0x1

LogLevel=1
