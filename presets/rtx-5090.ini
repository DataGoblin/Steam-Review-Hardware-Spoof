; GPUConfig preset: flagship gaming rig
;   GPU  NVIDIA GeForce RTX 5090, 32 GB (INF key NVIDIA_DEV.2B85)
;   CPU  AMD Ryzen 9 9950X3D, 16 cores / 32 threads
;   RAM  64 GB
; Copy over GPUConfig.ini next to version.dll.  Keys are documented in the
; GPUConfig.ini at the repo root.

[GPU]
Mode=custom

AdapterDescription=NVIDIA GeForce RTX 5090
VendorId=0x10DE
DeviceId=0x2B85
; NVIDIA's INF has no board-specific entry for this card, so this is a
; placeholder with NVIDIA as the subsystem vendor.
SubSysId=0x000010DE
VramGB=32
GLRenderer=NVIDIA GeForce RTX 5090/PCIe/SSE2
GLVendor=NVIDIA Corporation

CPUName=AMD Ryzen 9 9950X3D 16-Core Processor
CPUPhysicalCores=16
CPULogicalProcessors=32
CPUMaxClockMHz=4300
RamGB=64

; CPUID patching is opt-in; read the warning in GPUConfig.ini first.
SpoofCpu=false
CPUFamily=0x1A
CPUModel=0x44
CPUStepping=0x0

LogLevel=1
