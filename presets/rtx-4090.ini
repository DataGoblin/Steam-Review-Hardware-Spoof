; GPUConfig preset: previous-generation high end
;   GPU  NVIDIA GeForce RTX 4090, 24 GB (INF key NVIDIA_DEV.2684)
;   CPU  AMD Ryzen 7 7800X3D, 8 cores / 16 threads
;   RAM  32 GB
; Copy over GPUConfig.ini next to version.dll.  Keys are documented in the
; GPUConfig.ini at the repo root.

[GPU]
Mode=custom

AdapterDescription=NVIDIA GeForce RTX 4090
VendorId=0x10DE
DeviceId=0x2684
; NVIDIA's INF has no board-specific entry for this card, so this is a
; placeholder with NVIDIA as the subsystem vendor.
SubSysId=0x000010DE
VramGB=24
GLRenderer=NVIDIA GeForce RTX 4090/PCIe/SSE2
GLVendor=NVIDIA Corporation

CPUName=AMD Ryzen 7 7800X3D 8-Core Processor
CPUPhysicalCores=8
CPULogicalProcessors=16
CPUMaxClockMHz=4200
RamGB=32

; CPUID patching is opt-in; read the warning in GPUConfig.ini first.
SpoofCpu=false
CPUFamily=0x19
CPUModel=0x61
CPUStepping=0x2

LogLevel=1
