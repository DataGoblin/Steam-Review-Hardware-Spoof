[GPU]

; passthrough = log every intercepted query, return real values
; custom      = return the identity below
Mode=passthrough

; --- GPU -----------------------------------------------------------------
; The name and PCI IDs must describe the same card, because Steam blanks the
; Video Card field when its sources disagree.  NVIDIA lists both in the
; [Strings] section of the driver's nv_dispi.inf: the key
; NVIDIA_DEV.2BB4.204C.10DE means device 2BB4, subsystem 204C, subsystem
; vendor 10DE.
AdapterDescription=NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition
VendorId=0x10DE
DeviceId=0x2BB4

; (subsystem id << 16) | subsystem vendor id
SubSysId=0x204C10DE

VramGB=96

; Read but not applied yet: the OpenGL hook only logs.
GLRenderer=NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition/PCIe/SSE2
GLVendor=NVIDIA Corporation

; --- CPU / RAM -----------------------------------------------------------
; Returned through WMI (name, core counts, clock speed) and the kernel32
; memory-status calls (RAM) whenever Mode=custom.  A key that is left out
; falls back to the built-in default shown here, not to the real hardware,
; so keep every key present.
CPUName=AMD Ryzen Threadripper PRO 7995WX 96-Cores
CPUPhysicalCores=96
CPULogicalProcessors=192
CPUMaxClockMHz=2500
RamGB=128

; --- CPUID (opt-in) ------------------------------------------------------
; Steam reads the CPU brand, family, model, stepping and feature flags
; straight from the CPUID instruction, which WMI hooks cannot reach.  When
; SpoofCpu=true the DLL replaces every CPUID opcode in Steam's tier0_s64.dll
; with INT3+NOP and emulates the instruction from an exception handler,
; using CPUName and the three values below.  The CPU vendor string is not
; changed, so pick a CPU from the same vendor as the real one.
;
; This rewrites Valve's code pages in memory and is trivially visible to any
; anti-cheat memory scanner.  Enable it only for a screenshot session and
; never while an anti-cheat game will run.
SpoofCpu=false

; Threadripper PRO 7000 (Storm Peak, Zen 4) is family 0x19, model 0x18.
CPUFamily=0x19
CPUModel=0x18
CPUStepping=0x1

; Reserved (0 = quiet, 1 = normal, 2 = verbose).  Read but not acted on yet:
; every intercepted call is logged regardless.
LogLevel=1
